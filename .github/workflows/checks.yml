name: checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: version.json matches WM_BUILD_ID
        run: node scripts/sync_version.js --check
      - name: node tests
        run: bash scripts/run_tests.sh
